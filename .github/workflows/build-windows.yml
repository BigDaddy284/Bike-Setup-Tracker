name: Build Windows app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: bike-setup-tracker-windows
          path: release/*.exe
      # Publishing a release on GitHub (or pushing a v* tag) attaches all three downloads to it.
      - name: Attach downloads to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: |
            release/Bike-Setup-Tracker-Setup-*.exe
            release/Bike-Setup-Tracker-*-portable.exe
            android/Bike-Setup-Tracker-v2.apk
